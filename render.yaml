# Render Blueprint — one-click public demo for judges.
# Render Dashboard → New → Blueprint → pick this repo → Apply.
# Paid single-instance compute avoids Free-tier idle spin-down.
# Public demo: https://music-meets-alexa.onrender.com (MCP at /mcp).
services:
  - type: web
    name: music-meets-alexa
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
